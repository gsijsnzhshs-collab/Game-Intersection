<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贪吃蛇 · 霓虹游戏厅</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px 16px; display: flex; flex-direction: column;
      align-items: center; color: #f4fbff; font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #164251, #0b1630 55%, #0a0d1e); user-select: none;
    }
    .shell { width: min(100%, 620px); }
    .back { display: inline-block; margin-bottom: 21px; color: #b9d8e7; text-decoration: none; font-size: .92rem; }
    .back:hover, .back:focus-visible { color: #7fffd4; outline: none; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    h1 { margin: 0; font-size: clamp(1.75rem, 5vw, 2.35rem); letter-spacing: .15em; text-shadow: 0 0 15px rgba(45, 212, 191, .45); }
    .info { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-bottom: 14px; }
    .stat { flex: 1 1 120px; padding: 10px 12px; border: 1px solid #334b67; border-radius: 11px; background: rgba(11, 24, 45, .86); color: #b9c9dc; font-size: .92rem; }
    .stat span { margin-left: 3px; color: #7fffd4; font-weight: 800; font-size: 1.08rem; }
    button {
      border: 0; border-radius: 10px; padding: 9px 14px; color: #072027; background: #76ebca;
      font: inherit; font-weight: 800; cursor: pointer; transition: transform .15s, filter .15s;
    }
    button:hover, button:focus-visible { transform: translateY(-1px); filter: brightness(1.08); outline: 2px solid #fff; outline-offset: 2px; }
    canvas {
      display: block; width: 100%; aspect-ratio: 1; border: 3px solid #2dd4bf; border-radius: 13px;
      background: #0b0f1a; box-shadow: 0 0 27px rgba(45, 212, 191, .27); image-rendering: pixelated;
    }
    .controls { margin: 16px 0 0; color: #b5c0d0; text-align: center; line-height: 1.9; font-size: .92rem; }
    kbd { padding: 2px 7px; border: 1px solid #526279; border-bottom-width: 2px; border-radius: 5px; background: #202b42; color: #eef7ff; font-family: inherit; font-size: .82rem; }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(3, 8, 19, .70); z-index: 3; }
    #overlay.show { display: flex; }
    .modal { width: min(100%, 370px); padding: 30px; border: 1px solid #4ce1bf; border-radius: 18px; background: #14213b; text-align: center; box-shadow: 0 0 40px rgba(45, 212, 191, .3); }
    .modal h2 { margin: 0 0 11px; font-size: 1.65rem; }
    .modal p { margin: 0 0 22px; color: #c4d1df; line-height: 1.65; }
    @media (max-width: 420px) { body { padding: 18px 11px; } .stat { padding: 8px 10px; } }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="index.html">← 返回游戏合集</a>
    <div class="title-row"><h1>🐍 贪吃蛇</h1><button id="restart" type="button">重新开始</button></div>
    <div class="info" aria-label="游戏信息">
      <div class="stat">得分 <span id="score">0</span></div>
      <div class="stat">最高分 <span id="best">0</span></div>
      <div class="stat">速度 <span id="speed">1</span>x</div>
    </div>
    <canvas id="board" width="500" height="500" aria-label="贪吃蛇游戏棋盘"></canvas>
    <p class="controls"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移动　·　<kbd>空格</kbd> 暂停</p>
  </main>
  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal"><h2 id="modalTitle">游戏结束</h2><p id="modalText"></p><button id="restartBtn" type="button">再来一局</button></div>
  </div>
  <script>
    (() => {
      const canvas = document.querySelector('#board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.querySelector('#score'), bestEl = document.querySelector('#best'), speedEl = document.querySelector('#speed');
      const overlay = document.querySelector('#overlay'), modalTitle = document.querySelector('#modalTitle'), modalText = document.querySelector('#modalText');
      const GRID = 25, COLS = canvas.width / GRID, ROWS = canvas.height / GRID;
      const SPEEDS = [200, 165, 135, 110, 90, 75, 60], BEST_KEY = 'neon_arcade_snake_best';
      let snake, dir, nextDir, food, score, best, speedLevel, finished, paused, loopId;
      best = Number(localStorage.getItem(BEST_KEY)) || 0; bestEl.textContent = best;

      function resetGame() {
        snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
        dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 }; score = 0; speedLevel = 0; finished = false; paused = false;
        scoreEl.textContent = '0'; speedEl.textContent = '1'; overlay.classList.remove('show'); placeFood();
        clearInterval(loopId); loopId = setInterval(tick, SPEEDS[speedLevel]); draw();
      }
      function placeFood() {
        const free = [];
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!snake.some(part => part.x === x && part.y === y)) free.push({ x, y });
        if (!free.length) { finish(true); return; }
        food = free[Math.floor(Math.random() * free.length)];
      }
      function tick() {
        if (paused || finished) return;
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        const wall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
        const body = snake.slice(0, -1).some(part => part.x === head.x && part.y === head.y);
        if (wall || body) { finish(false); return; }
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10; scoreEl.textContent = score;
          const nextLevel = Math.min(SPEEDS.length - 1, Math.floor(score / 30));
          if (nextLevel !== speedLevel) { speedLevel = nextLevel; speedEl.textContent = String(speedLevel + 1); clearInterval(loopId); loopId = setInterval(tick, SPEEDS[speedLevel]); }
          placeFood();
        } else snake.pop();
        draw();
      }
      function finish(won) {
        finished = true; clearInterval(loopId);
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem(BEST_KEY, String(best)); }
        modalTitle.textContent = won ? '🎉 恭喜通关！' : '💀 游戏结束';
        modalText.textContent = won ? '棋盘已被填满！得分：' + score : '本次得分：' + score + '　最高分：' + best;
        overlay.classList.add('show'); draw();
      }
      function rounded(x, y, width, height, radius) {
        ctx.beginPath(); ctx.moveTo(x + radius, y); ctx.arcTo(x + width, y, x + width, y + height, radius); ctx.arcTo(x + width, y + height, x, y + height, radius);
        ctx.arcTo(x, y + height, x, y, radius); ctx.arcTo(x, y, x + width, y, radius); ctx.closePath();
      }
      function draw() {
        ctx.fillStyle = '#0b0f1a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 1;
        for (let i = 1; i < COLS; i++) { ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, canvas.height); ctx.stroke(); }
        for (let i = 1; i < ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(canvas.width, i * GRID); ctx.stroke(); }
        const pulse = .82 + .18 * Math.sin(Date.now() / 180);
        ctx.fillStyle = '#ff6b7c'; ctx.beginPath(); ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID * .34 * pulse, 0, Math.PI * 2); ctx.fill();
        for (let i = snake.length - 1; i >= 0; i--) {
          const part = snake[i], head = i === 0, pad = head ? 1 : 2;
          const gradient = ctx.createRadialGradient(part.x * GRID + GRID / 2, part.y * GRID + GRID / 2, 1, part.x * GRID + GRID / 2, part.y * GRID + GRID / 2, GRID / 2);
          gradient.addColorStop(0, head ? '#b9ffe4' : '#49d9c2'); gradient.addColorStop(1, head ? '#16b995' : '#0d8b83');
          ctx.fillStyle = gradient; rounded(part.x * GRID + pad, part.y * GRID + pad, GRID - pad * 2, GRID - pad * 2, 5); ctx.fill();
        }
        const head = snake[0], eyes = dir.x === 1 ? [[17, 8], [17, 17]] : dir.x === -1 ? [[8, 8], [8, 17]] : dir.y === -1 ? [[8, 8], [17, 8]] : [[8, 17], [17, 17]];
        ctx.fillStyle = '#062d30'; eyes.forEach(eye => { ctx.beginPath(); ctx.arc(head.x * GRID + eye[0], head.y * GRID + eye[1], 2.7, 0, Math.PI * 2); ctx.fill(); });
      }
      function setDirection(x, y) { if (!finished && !(x === -dir.x && y === -dir.y)) nextDir = { x: x, y: y }; }
      document.addEventListener('keydown', event => {
        const key = event.key.toLowerCase(), moves = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
        if (moves[key] || key === ' ') event.preventDefault();
        if (moves[key]) setDirection(moves[key][0], moves[key][1]);
        if (key === ' ' && !finished) { paused = !paused; draw(); }
      });
      document.querySelector('#restart').addEventListener('click', resetGame);
      document.querySelector('#restartBtn').addEventListener('click', resetGame);
      resetGame();
    })();
  </script>
</body>
</html>
